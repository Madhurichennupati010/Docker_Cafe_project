name: CI-CD Minikube

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cafe:${{ github.sha }} .

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/cafe:${{ github.sha }}

      - name: Update Kubernetes Deployment
        run: |
          kubectl set image deployment/cafe-app \
            cafe=${{ secrets.DOCKER_USERNAME }}/cafe:${{ github.sha }}

      - name: Wait for Rollout
        run: |
          kubectl rollout status deployment/cafe-app
