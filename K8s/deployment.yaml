apiVersion: apps/v1
kind: Deployment

metadata:
  name: cafe-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cafe

  template:
    metadata:
      labels:
        app: cafe

    spec:
      containers:
      - name: cafe

        image: madhu934652/cafe-website:v1

        imagePullPolicy: Always

        ports:
        - containerPort: 80

        resources:

          requests:
            cpu: 100m
            memory: 128Mi

          limits:
            cpu: 300m
            memory: 256Mi
