apiVersion: apps/v1
kind: Deployment

metadata:
  name: cafe-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cafe

  template:
    metadata:
      labels:
        app: cafe

    spec:
      containers:

      - name: cafe

        image: madhu934652/cafe-website:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 80

        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "300m"
            memory: "256Mi"

        readinessProbe:

          httpGet:
            path: /
            port: 80

          initialDelaySeconds: 5

        livenessProbe:

          httpGet:
            path: /
            port: 80

          initialDelaySeconds: 20
